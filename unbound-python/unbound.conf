# Default container config for an Unbound server with cachedb + iterator + python.
#
# Note: `unbound-checkconf` may reject `cachedb iterator python` as an
# unsupported ordering, but the Unbound daemon can run this stack when the
# Python runtime module is installed. This image smoke-tests the daemon path.

server:
  verbosity: 1

  interface: 0.0.0.0
  interface: ::0
  port: 53

  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Suitable for container/private-network usage. Avoid publishing this as an
  # unrestricted public resolver unless you add stricter access-control rules.
  access-control: 0.0.0.0/0 allow
  access-control: ::0/0 allow

  username: "unbound"
  directory: "/var/unbound"
  chroot: ""
  pidfile: ""
  root-hints: "root.hints"
  auto-trust-anchor-file: "root.key"

  # Match container-friendly defaults from klutchell/unbound. Using the system
  # socket buffer sizes avoids warnings when the host does not grant 4 MiB
  # net.core.{r,w}mem_max buffers inside an unprivileged Docker container.
  so-rcvbuf: 0
  so-sndbuf: 0

  # Run Python before cache/iterator so the default Python policy can block
  # selected RR types before they are cached or resolved upstream.
  module-config: "python cachedb iterator"

  # Allow users to mount additional top-level fragments such as forward-zone,
  # remote-control, cachedb backend settings, etc. Support both this image's
  # native directory and klutchell/unbound's custom.conf.d convention.
  include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"
  include-toplevel: "/etc/unbound/custom.conf.d/*.conf"

python:
  # Default policy: suppress AAAA and HTTPS records with NOERROR/NODATA.
  python-script: "/etc/unbound/python/block_aaaa_https.py"
