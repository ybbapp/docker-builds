# Default container config for an Unbound server with cachedb + iterator + python.
#
# Note: `unbound-checkconf` may reject `cachedb iterator python` as an
# unsupported ordering, but the Unbound daemon can run this stack when the
# Python runtime module is installed. This image smoke-tests the daemon path.

server:
  verbosity: 1

  interface: 0.0.0.0
  interface: ::0
  port: 53

  do-ip4: yes
  do-ip6: yes
  do-udp: yes
  do-tcp: yes

  # Suitable for container/private-network usage. Avoid publishing this as an
  # unrestricted public resolver unless you add stricter access-control rules.
  access-control: 0.0.0.0/0 allow
  access-control: ::0/0 allow

  username: "unbound"
  directory: "/etc/unbound"
  chroot: ""
  pidfile: "/run/unbound/unbound.pid"
  root-hints: "/usr/share/dns/root.hints"
  auto-trust-anchor-file: "/var/lib/unbound/root.key"

  # Requested module stack.
  module-config: "cachedb iterator python"

  # Allow users to mount additional top-level fragments such as forward-zone,
  # remote-control, cachedb backend settings, etc.
  include-toplevel: "/etc/unbound/unbound.conf.d/*.conf"

python:
  # Replace this file or override this section to run a real Python module.
  python-script: "/etc/unbound/python/noop.py"
