name: Build sing-box image

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "sing-box version to build (e.g. 1.12.0). Leave empty to auto-detect latest."
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved sing-box version: ${VERSION}"

      - name: Check if image already exists
        id: check
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "${{ inputs.version }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/sing-box:v${VERSION} > /dev/null 2>&1; then
            echo "Image ghcr.io/${{ github.repository_owner }}/sing-box:v${VERSION} already exists, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./singbox
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sing-box:${{ needs.resolve-version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sing-box:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  set-visibility:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/set-visibility.yml
    with:
      packages: "sing-box"
