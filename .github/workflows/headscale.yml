name: Build headscale image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "ybbapp/headscale tag to build"
        required: false
        default: "v0.29.3-home"
        type: string

env:
  REGISTRY: ghcr.io
  SOURCE_REPOSITORY: ybbapp/headscale

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve source tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v0.29.3-home"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${SOURCE_REPOSITORY}:${TAG}"

      - name: Checkout build definitions
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./headscale
          file: ./headscale/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ env.SOURCE_REPOSITORY }}
            SOURCE_TAG=${{ steps.source.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/headscale:${{ steps.source.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/headscale:latest

  set-visibility:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/set-visibility.yml
    with:
      packages: "headscale"
