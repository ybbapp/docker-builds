name: Build unbound-python image

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      debian_version:
        description: "Debian version tag (default: bookworm)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Debian version
        id: debian
        run: |
          DEBIAN_VERSION="${{ inputs.debian_version }}"
          if [ -z "$DEBIAN_VERSION" ]; then
            DEBIAN_VERSION="bookworm"
          fi
          echo "version=${DEBIAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./unbound-python
          file: ./unbound-python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEBIAN_VERSION=${{ steps.debian.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/unbound-python:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/unbound-python:${{ steps.debian.outputs.version }}

  set-visibility:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/set-visibility.yml
    with:
      packages: "unbound-python"
