name: Set package visibility

on:
  workflow_call:
    inputs:
      packages:
        description: "Comma-separated list of package names to set public (e.g. frpc,frps)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated list of package names to set public (e.g. frpc,frps)"
        required: true
        type: string

jobs:
  set-visibility:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set packages to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)  # trim whitespace
            [ -n "$pkg" ] || continue

            package_url="https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/pkgs/container/${pkg}"

            echo "Setting $pkg to public..."
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              /orgs/${{ github.repository_owner }}/packages/container/${pkg}/visibility \
              -f visibility=public; then
              echo "$pkg visibility set to public via API."
              continue
            fi

            # GitHub currently returns 404 for repository-scoped GHCR packages on
            # this endpoint even when the package page is already public. Treat a
            # publicly accessible package page as success to avoid false warnings.
            if curl -fsSI "$package_url" >/dev/null; then
              echo "$pkg is publicly accessible at $package_url"
            else
              echo "::warning::Failed to set $pkg public and public page is not accessible: $package_url"
            fi
          done
