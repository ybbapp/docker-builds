name: Set package visibility

on:
  workflow_call:
    inputs:
      packages:
        description: "Comma-separated list of package names to set public (e.g. frpc,frps)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated list of package names to set public (e.g. frpc,frps)"
        required: true
        type: string

jobs:
  set-visibility:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set packages to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PKGS <<< "${{ inputs.packages }}"
          for pkg in "${PKGS[@]}"; do
            pkg=$(echo "$pkg" | xargs)  # trim whitespace
            [ -n "$pkg" ] || continue

            package_url="https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/pkgs/container/${pkg}"

            echo "Checking $pkg visibility..."
            if curl -fsSI "$package_url" >/dev/null; then
              echo "$pkg is already publicly accessible at $package_url"
              continue
            fi

            echo "$pkg is not publicly accessible yet; setting it to public via GitHub API..."
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              /orgs/${{ github.repository_owner }}/packages/container/${pkg}/visibility \
              -f visibility=public

            if curl -fsSI "$package_url" >/dev/null; then
              echo "$pkg visibility set to public and verified at $package_url"
            else
              echo "::error::GitHub API call completed, but public package page is still not accessible: $package_url"
              exit 1
            fi
          done
