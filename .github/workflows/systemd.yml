name: Build systemd images

on:
  push:
    branches: [main]
    paths:
      - "systemd/**"
      - ".github/workflows/systemd.yml"
  workflow_dispatch:
    inputs:
      debian_version:
        description: "Debian version tag (default: latest)"
        required: false
        type: string
      alpine_version:
        description: "Alpine version tag (default: latest)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: debian
            context: ./systemd/debian
          - variant: alpine
            context: ./systemd/alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [ "${{ matrix.variant }}" = "debian" ]; then
            VERSION="${{ inputs.debian_version }}"
          else
            VERSION="${{ inputs.alpine_version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/systemd:${{ matrix.variant }}

  set-visibility:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/set-visibility.yml
    with:
      packages: "systemd"
