name: Build tailscale-exitnode image

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kernel: singbox
            dev_tools: "false"
          - kernel: singbox
            dev_tools: "true"
          - kernel: mihomo
            dev_tools: "false"
          - kernel: mihomo
            dev_tools: "true"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/tailscale-exitnode"
          {
            echo "tags<<EOF"
            case "${{ matrix.kernel }}:${{ matrix.dev_tools }}" in
              singbox:false)
                echo "${IMAGE}:latest"
                echo "${IMAGE}:singbox"
                ;;
              singbox:true)
                echo "${IMAGE}:singbox-dev"
                ;;
              mihomo:false)
                echo "${IMAGE}:mihomo"
                ;;
              mihomo:true)
                echo "${IMAGE}:mihomo-dev"
                ;;
              *)
                echo "Unsupported matrix entry" >&2
                exit 1
                ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tailscale-exitnode
          file: ./tailscale-exitnode/Dockerfile.${{ matrix.kernel }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEV_TOOLS=${{ matrix.dev_tools }}
          tags: |
            ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=tailscale-exitnode-${{ matrix.kernel }}-${{ matrix.dev_tools }}
          cache-to: type=gha,mode=max,scope=tailscale-exitnode-${{ matrix.kernel }}-${{ matrix.dev_tools }}

  set-visibility:
    needs: build
    permissions:
      packages: write
    uses: ./.github/workflows/set-visibility.yml
    with:
      packages: "tailscale-exitnode"
